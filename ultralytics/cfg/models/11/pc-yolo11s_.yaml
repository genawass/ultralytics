# PC-YOLO11s Configuration (derived from YOLOv11n)
# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  # Values for 'n' scale are used below (depth_multiple=0.50, width_multiple=0.25)
  #n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  #m: [0.50, 1.00, 512]
  #l: [1.00, 1.00, 512]
  #x: [1.00, 1.50, 512]

# PC-YOLO11s backbone (based on YOLOv11n with CSA modifications)
# n_scale_depth_multiple = 0.50
# n_scale_width_multiple = 0.25
backbone:
  # [from, repeats, module, args(c_out_scaled, n_repeats_scaled, other_args...)]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2 (64*0.25=16)
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4 (128*0.25=32) <- P2 source for head
  - [-1, 1, CSA_C3k2_F, [256, 1, 0.25]]  # 2 (c2=256*0.25=64, n=max(1,int(2*0.5))=1, e=0.25)
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8 (256*0.25=64) <- P3 source for head
  - [-1, 1, CSA_C3k2_F, [512, 1, 0.25]] # 4 (c2=512*0.25=128, n=max(1,int(2*0.5))=1, e=0.25)
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16 (512*0.25=128) <- P4 source for head
  - [-1, 1, C3k2, [512, True, 0.5]]     # 6 (c2=512*0.25=128, n=max(1,int(2*0.5))=1, e=0.5 for C3k2 True) No CSA
  - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32 (1024*0.25=256)
  - [-1, 1, C3k2, [1024, True, 0.5]]     # 8 (c2=1024*0.25=256, n=max(1,int(2*0.5))=1, e=0.5 for C3k2 True) No CSA
  - [-1, 1, CSA_SPPF, [1024, 5]]         # 9 (c_out=1024*0.25=256, k=5)
  - [-1, 1, C2PSA, [1024]]               # 10 (channels=1024*0.25=256). Assuming C2PSA repeats=2, so n=max(1,int(2*0.5))=1.
                                        # Original YOLOv11n has C2PSA repeats=2.

# PC-YOLO11s head (P2, P3, P4 outputs)
head:
  # Block 1: Upsample → Concat with P4 → CSA_C3k2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, CSA_C3k2_F, [512, 1, 0.5]]

  # Block 2: Upsample → Concat with P3 → CSA_C3k2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, CSA_C3k2_F, [256, 1, 0.5]]

  # Block 3: Upsample → Concat with P2 → CSA_C3k2  (outputs P2)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, CSA_C3k2_F, [128, 1, 0.5]]   # <-- P2

  # Block 4: Conv (downsample) → Concat with Block 2 → CSA_C3k2  (outputs P3)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 1, CSA_C3k2_F, [256, 1, 0.5]]   # <-- P3

  # Block 5: Conv (downsample) → Concat with Block 1 → CSA_C3k2  (outputs P4)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, CSA_C3k2_F, [512, 1, 0.5]]   # <-- P4

  # Final Detect on P2, P3, P4
  - [[19, 22, 25], 1, Detect, [nc]]