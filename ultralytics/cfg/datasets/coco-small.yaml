# COCO Small Objects dataset
# This is a modified COCO configuration that focuses on small objects

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /home/genadiy/datasets/coco  # dataset root dir (change this to your actual COCO path)
train: train2017.txt  # train images
val: val2017.txt  # val images
test: test-dev2017.txt  # test images (optional)

# Classes
